services:
  app:
    build: .
    image: shabetzna:latest
    container_name: shabetzna
    restart: unless-stopped
    # loopback only — exposed to the tailnet via `tailscale serve`
    ports:
      - "127.0.0.1:3000:3000"
    env_file: /etc/shabetz-na/.env
    environment:
      DATABASE_PATH: /data/shabetz.db
    volumes:
      - /srv/shabetz-na:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
